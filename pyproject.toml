[project]
name = "sherlock-langgraph-agent"
version = "0.1.0"
description = "A LangGraph ReAct agent (checkpointer persistence, before_agent middleware, human-in-the-loop) demoed as a sarcastic Sherlock Holmes detective."
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
